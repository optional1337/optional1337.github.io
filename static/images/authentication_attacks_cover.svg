<text x="76" y="514" font-family="monospace" font-size="12" fill="#3fb950">$</text>
<text x="92" y="514" font-family="monospace" font-size="12" fill="#8b949e">ffuf -u /login -X POST -d "username=hkerrigan&amp;password=FUZZ" -w wordlist.txt</text>

<text x="76" y="536" font-family="monospace" font-size="12" fill="#3fb950">$</text>
<text x="92" y="536" font-family="monospace" font-size="12" fill="#8b949e">crunch 4 4 0123456789 -t %%%% &gt;&gt; num.txt</text>

