<text x="76" y="326" font-family="monospace" font-size="52" font-weight="700" fill="#ff6b6b" letter-spacing="-1">Attacks</text>

<!-- Subtitle -->
<text x="76" y="372" font-family="monospace" font-size="16" fill="#8b949e">six web security challenge labs</text>

