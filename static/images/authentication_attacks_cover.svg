<rect x="76" y="438" width="200" height="26" rx="4" fill="#111820"/>
<text x="176" y="456" text-anchor="middle" font-family="monospace" font-size="12" fill="#c9d1d9">04 · Heartwood Outfitters</text>

<rect x="288" y="438" width="200" height="26" rx="4" fill="#111820"/>
<text x="388" y="456" text-anchor="middle" font-family="monospace" font-size="12" fill="#c9d1d9">05 · Halftrack Railroad</text>

