<title>Stillwater Co-op Bank cover — JWT kid Path Traversal attack</title>

<!-- Background -->
<rect width="1210" height="640" fill="#0d1117"/>

<!-- Grid lines -->
<g fill="none" stroke="#1c2333" stroke-width="0.8">
  <line x1="0" y1="80" x2="1210" y2="80"/>
  <line x1="0" y1="160" x2="1210" y2="160" mask="url(#text-gaps-stillwater)"/>
  <line x1="0" y1="240" x2="1210" y2="240" mask="url(#text-gaps-stillwater)"/>
  <line x1="0" y1="320" x2="1210" y2="320" mask="url(#text-gaps-stillwater)"/>
  <line x1="0" y1="400" x2="1210" y2="400" mask="url(#text-gaps-stillwater)"/>
  <line x1="0" y1="480" x2="1210" y2="480"/>
  <line x1="0" y1="560" x2="1210" y2="560"/>
  <line x1="200" y1="0" x2="200" y2="640" mask="url(#text-gaps-stillwater)"/>
  <line x1="400" y1="0" x2="400" y2="640" mask="url(#text-gaps-stillwater)"/>
  <line x1="600" y1="0" x2="600" y2="640" mask="url(#text-gaps-stillwater)"/>
  <line x1="800" y1="0" x2="800" y2="640"/>
  <line x1="1000" y1="0" x2="1000" y2="640" mask="url(#text-gaps-stillwater)"/>
</g>

<!-- Left accent bar — teal for kid traversal theme -->
<rect x="60" y="195" width="4" height="250" rx="2" fill="#58d4c5" opacity="0.75"/>

<!-- Tags -->
<rect x="80" y="116" width="94" height="28" rx="4" fill="#1a2744"/>
<text x="127" y="135" text-anchor="middle" font-family="monospace" font-size="13" font-weight="500" fill="#7c9cff">webverse</text>

<rect x="184" y="116" width="56" height="28" rx="4" fill="#0f2020"/>
<text x="212" y="135" text-anchor="middle" font-family="monospace" font-size="13" font-weight="500" fill="#58d4c5">JWT</text>

<!-- Headline -->
<text x="76" y="262" font-family="monospace" font-size="52" font-weight="700" fill="#f0f6ff" letter-spacing="-1">Stillwater</text>
<text x="76" y="326" font-family="monospace" font-size="52" font-weight="700" fill="#58d4c5" letter-spacing="-1">Co-op Bank</text>

<!-- Subtitle -->
<text x="76" y="372" font-family="monospace" font-size="16" fill="#8b949e">kid path traversal — privilege escalation</text>

<!-- Terminal lines -->
<text x="76" y="418" font-family="monospace" font-size="12" fill="#3fb950">$</text>
<text x="92" y="418" font-family="monospace" font-size="12" fill="#8b949e">kid: <tspan fill="#58d4c5">../../dev/null</tspan>  →  secret: <tspan fill="#3fb950">AA==</tspan></text>

<text x="76" y="440" font-family="monospace" font-size="12" fill="#3fb950">$</text>
<text x="92" y="440" font-family="monospace" font-size="12" fill="#8b949e">kid: <tspan fill="#58d4c5">../../proc/sys/kernel/randomize_va_space</tspan>  →  <tspan fill="#3fb950">Mgo=</tspan></text>

<!-- Divider -->
<line x1="60" y1="462" x2="700" y2="462" stroke="#1c2333" stroke-width="1"/>

<!-- Bottom note -->
<text x="76" y="486" font-family="monospace" font-size="12" fill="#484f58">method 1 — /dev/null  ·  method 2 — known kernel file</text>

<!-- ─── RIGHT PANEL ─── -->

<!-- Panel backdrop behind diagram -->
<rect x="804" y="98" width="220" height="376" rx="14" fill="#0e1726" stroke="#1c2c33" stroke-width="1"/>
<rect x="804" y="98" width="220" height="376" rx="14" fill="#58d4c5" opacity="0.03"/>

<!-- Decorative data stream filling right margin -->
<g font-family="monospace" font-size="11" fill="#1c2c33">
  <text x="1050" y="150">0x7ffe2c10</text>
  <text x="1050" y="180">0x00400520</text>
  <text x="1050" y="210">kid=../../</text>
  <text x="1050" y="240">SIG_HMAC256</text>
  <text x="1050" y="270">0xdeadbeef</text>
  <text x="1050" y="300">alg: HS256</text>
  <text x="1050" y="330">0x0000aa==</text>
  <text x="1050" y="360">payload.sig</text>
  <text x="1050" y="390">verify(true)</text>
  <text x="1050" y="420">0x1f2e3d4c</text>
  <text x="1050" y="450">role=admin</text>
</g>
<line x1="1030" y1="120" x2="1030" y2="470" stroke="#1c2333" stroke-width="0.8"/>


<!-- kid header box (source) -->
<rect x="830" y="152" width="120" height="50" rx="6" fill="#0f2020" stroke="#58d4c5" stroke-width="1.5"/>
