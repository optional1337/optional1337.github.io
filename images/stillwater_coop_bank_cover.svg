<text x="890" y="192" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#58d4c5">kid</text>

<!-- label above -->
<rect x="846" y="120" width="88" height="20" rx="3" fill="#0a1a1a"/>
<text x="890" y="134" text-anchor="middle" font-family="monospace" font-size="11" fill="#58d4c5">user-controlled</text>

<!-- Arrow down -->
<line x1="890" y1="204" x2="890" y2="246" stroke="#58d4c5" stroke-width="2"/>
<path d="M882 240 L890 254 L898 240" fill="none" stroke="#58d4c5" stroke-width="2" stroke-linecap="round"/>

<!-- path label on arrow -->
<rect x="832" y="216" width="116" height="20" rx="3" fill="#0a1f1a"/>
<text x="890" y="230" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">file-read, no sanitise</text>

<!-- file box -->
<rect x="830" y="256" width="120" height="50" rx="6" fill="#0a1a10" stroke="#3fb950" stroke-width="1.5"/>
<text x="890" y="278" text-anchor="middle" font-family="monospace" font-size="11" fill="#8b949e">reads file on disk</text>
<text x="890" y="296" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#3fb950">/dev/null</text>

<!-- Arrow down -->
<line x1="890" y1="308" x2="890" y2="348" stroke="#3fb950" stroke-width="2"/>
<path d="M882 342 L890 356 L898 342" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>

<!-- secret label on arrow -->
