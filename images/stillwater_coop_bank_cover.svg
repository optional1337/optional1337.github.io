    <rect x="80" y="116" width="94" height="28" fill="black" rx="2"/>
    <rect x="184" y="116" width="56" height="28" fill="black" rx="2"/>
    <!-- headline -->
    <rect x="76" y="195" width="480" height="88" fill="black" rx="2"/>
    <rect x="76" y="280" width="330" height="88" fill="black" rx="2"/>
    <!-- subtitle -->
    <rect x="76" y="374" width="460" height="30" fill="black" rx="2"/>
    <!-- terminal lines -->
    <rect x="76" y="420" width="560" height="18" fill="black" rx="2"/>
    <rect x="76" y="442" width="420" height="18" fill="black" rx="2"/>
    <!-- right panel labels -->
    <rect x="838" y="160" width="110" height="36" fill="black" rx="2"/>
    <rect x="838" y="300" width="110" height="36" fill="black" rx="2"/>
    <rect x="844" y="204" width="98" height="18" fill="black" rx="2"/>
