<text x="890" y="332" text-anchor="middle" font-family="monospace" font-size="10" fill="#8b949e">HMAC secret</text>

<!-- secret value box -->
<rect x="848" y="358" width="84" height="28" rx="4" fill="#0f1f0f"/>
<text x="890" y="377" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#3fb950">AA==</text>

<!-- Arrow down -->
<line x1="890" y1="388" x2="890" y2="418" stroke="#e8a628" stroke-width="2"/>
<path d="M882 412 L890 426 L898 412" fill="none" stroke="#e8a628" stroke-width="2" stroke-linecap="round"/>

<!-- role: admin result -->
<rect x="830" y="428" width="120" height="28" rx="4" fill="#1c2a1c"/>
<text x="890" y="447" text-anchor="middle" font-family="monospace" font-size="12" fill="#3fb950">role: admin</text>

<!-- Site name -->
<text x="1140" y="608" text-anchor="end" font-family="monospace" font-size="16" fill="#484f58">optional1337.github.io</text>

